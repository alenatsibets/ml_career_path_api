name: infra-ml

on:
  workflow_dispatch:
    inputs:
      action:
        description: "plan, apply, or destroy"
        required: true
        default: "plan"
        type: choice
        options: [plan, apply, destroy]
      image:
        description: "Full ECR image URI (repo:tag)"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::423161708569:role/GitHubActionsTerraformMlRole
          aws-region: eu-north-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Init
        working-directory: infra
        run: terraform init

      - name: Validate
        working-directory: infra
        run: terraform validate

      - name: Plan
        if: inputs.action == 'plan'
        working-directory: infra
        run: terraform plan -var="image=${{ inputs.image }}"

      - name: Apply
        if: inputs.action == 'apply'
        working-directory: infra
        run: terraform apply -auto-approve -var="image=${{ inputs.image }}"

      - name: Destroy
        if: ${{ inputs.action == 'destroy' }}
        working-directory: infra
        run: terraform destroy -auto-approve -var="image=${{ inputs.image }}"