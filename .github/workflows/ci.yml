name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  test-build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Run tests with coverage
        run: |
          pytest --cov=. --cov-report=term-missing --cov-report=xml

      - name: Enforce minimum test coverage (70%)
        run: |
          coverage_total=$(coverage report | awk 'END{print $4}' | sed 's/%//')
          echo "Total coverage: $coverage_total%"
          if (( $(echo "$coverage_total < 70" | bc -l) )); then
            echo "Coverage below 70% threshold."
            exit 1
          else
            echo "Coverage requirement satisfied."
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ github.event_name == 'push' && 'arn:aws:iam::423161708569:role/GitHubActionsDeployRole-ML' || 'arn:aws:iam::423161708569:role/GitHubActionsDefaultRole' }}
          aws-region: eu-north-1

      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        if: github.event_name == 'push'
        env:
          ECR_REGISTRY: 423161708569.dkr.ecr.eu-north-1.amazonaws.com
          ECR_REPOSITORY: ml
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          echo "IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Print image URI
        if: github.event_name == 'push'
        run: |
          echo "Built image: $IMAGE_URI"
